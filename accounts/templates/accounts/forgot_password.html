
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .forgot-card {
            width: 420px;
            max-width: 92%;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eaf0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #183b8c;
        }

        .title {
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            color: #172554;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #d9dee8;
            padding: 0 14px;
        }

        .form-control:focus {
            border-color: #183b8c;
            box-shadow: 0 0 0 3px rgba(24, 59, 140, 0.1);
        }

        .reset-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #183b8c;
            color: white;
            font-weight: 600;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #102e70;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .back-login a {
            color: #183b8c;
            text-decoration: none;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 13px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="forgot-card">

    <div class="icon-box">
        🔐
    </div>

    <h2 class="title">
        Forgot Password?
    </h2>

    <p class="description">
        Enter your Student ID and registered phone number
        to reset your password.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">
                Student ID
            </label>

            <input
                type="text"
                name="student_id"
                class="form-control"
                placeholder="e.g. ST001"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                Registered Phone Number
            </label>

            <input
                type="text"
                name="phone"
                class="form-control"
                placeholder="Enter your phone number"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                class="form-control"
                placeholder="Enter new password"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm new password"
                required
            >
        </div>

        <button type="submit" class="reset-btn">
            Reset Password
        </button>
    </form>

    <div class="back-login">
        <a href="{% url 'accounts:login' %}">
            ← Back to Login
        </a>
    </div>

</div>

</body>
</html>
