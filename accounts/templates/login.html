<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS 1 JS 1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome icon 1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            background-color: #eef2f5;

            font-family: "Poppins",sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .login-card{
            max-width: 850px;
            height: auto;

            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.08);
        }

        .left-box{
            background: linear-gradient(180deg, #072051 0%, #0c337a 100%);
            color: #ffffff;
        }

        .custom-input {
            background-color: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 14px;
        }

        .custom-input:focus {
            background-color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 4px;
        }

        .btn-custom {
            background-color: #0d52d6;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 15px;
        }

        .btn-custom:hover {
            background-color: #0a42ad;
        }
    </style>
</head>
<body>
     <div class="login-card d-flex justify-content-center align-items-center">

         <div class="row">

             <!--left box image-->
             <div class="col-md-6 d-flex flex-column align-items-center text-center p-lg-5 p-4 left-box">
                <!-- icon-section -->
                <div class="mb-3">
                    <i class="bi bi-person-bounding-box display-3"></i>
                </div>

                <!-- Title & Subtitle -->
                <h3 class="fs-4 fw-bold text-uppercase">Smart Attendance System</h3>
                <p class="text-white-50 fs-7 mb-4">Making Attendance Simple & Smart</p>

                <!-- Image -->
                <div class="mb-3">

                </div>
             </div>

             <div class="col-md-6 p-lg-4 p-2  bg-white">
                <div class="text-center mb-4">
                    <h3 class="fw-bold fs-3 text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted fs-7">Login to your account</p>
                </div>

                    <form method="POST">
                        {% csrf_token %}
                        {% if error  %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                        {% endif %}
                        <div class="mb-3">
                            <label class="form-label" for="roleselect">Select Role</label>
                            <select id="roleselect" class="form-select custom-input" name="role">
                                <option value="ADMIN">Admin</option>
                                <option value="TEACHER">Teacher</option>
                                <option value="STUDENT">Student</option>
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input type="text" id="username" class="form-control custom-input" name="username" placeholder="Enter Username"/>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" id="password" class="form-control custom-input" name="password" placeholder="Enter Password"/>
                        </div>

                        <div class="d-flex justify-content-between mb-4 fs-7">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberme"/>
                                <label class="form-check-label text-muted" for="rememberme">Rememeber Me</label>
                            </div>
                            <a href="{% url 'accounts:forgot_password' %}" class="text-decoration-none fw-semibold">Forgot Password ?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-custom w-100">Login</button>

                    </form>
            </div>
        </div>
     </div>

</body>
</html>
